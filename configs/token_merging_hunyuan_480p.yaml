model:
  id: tencent/HunyuanVideo
  revision: refs/pr/18
  transformer_subfolder: transformer
  dtype: bf16
  scheduler_shift: 7.0
  device: cuda
  local_files_only: false
  # Whole-model offload keeps the text encoders and VAE off the GPU while the
  # 13B transformer denoises. Use sequential_cpu_offload only as a slower,
  # lower-memory fallback; the two options are mutually exclusive.
  model_cpu_offload: true
  sequential_cpu_offload: false
  enable_vae_tiling: true

generation:
  height: 480
  width: 720
  num_frames: 129
  num_inference_steps: 50
  guidance_scale: 6.0
  true_cfg_scale: 1.0
  max_sequence_length: 256
  fps: 24

token_merging_args:
  enable: true
  f_tied: 1
  h_reduce: 1
  w_reduce: 1
  layout: hard_route
  num_merge_tokens: 1
  q_init: ith
  # Keeping this at one bounds the largest temporary GridMerge tensor. Raise
  # it only after measuring memory on the target GPU.
  query_outer_chunk: 1
