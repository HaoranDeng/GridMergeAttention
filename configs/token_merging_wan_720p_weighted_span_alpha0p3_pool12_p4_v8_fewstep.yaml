# Lite per-frame Weighted-Span C4.
#
# Every latent frame independently selects four seed rows from twelve
# deterministic multiscale candidates using four attention probes. This keeps
# the original weighted Gram-Schmidt objective while reducing selector work;
# there is no temporal sharing, dense rescue, or residual-key path.
image_or_video_shape:
  - 1
  - 21
  - 16
  - 90
  - 160
denoising_step_list:
  - 1000
  - 750
  - 500
  - 250
warp_denoising_step: true
model_kwargs:
  model_name: Wan2.1-T2V-14B-StepDistill-CfgDistill
  load_pretrained_weights: false
  timestep_shift: 5.0
token_merging_args:
  enable: true
  f_tied: 1
  h_reduce: 1
  w_reduce: 1
  layout: hard_route
  query_outer_chunk: 1
  head_chunk: 2
  num_merge_tokens: 4
  seed_mode: weighted_span_alpha0p3_pool12_p4_v8
  seed: 0
  hard_route_backend: hard_c4
