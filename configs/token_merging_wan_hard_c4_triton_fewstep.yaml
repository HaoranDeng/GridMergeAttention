image_or_video_shape:
  - 1
  - 21
  - 16
  - 60
  - 104
denoising_step_list:
  - 1000
  - 750
  - 500
  - 250
warp_denoising_step: true
model_kwargs:
  model_name: Wan2.1-T2V-1.3B
  timestep_shift: 5.0
token_merging_args:
  enable: true
  f_tied: 1
  h_reduce: 1
  w_reduce: 1
  layout: hard_route
  query_outer_chunk: 10
  num_merge_tokens: 4
  seed_mode: spread_c4
  seed: 0
  # Non-shared hard-route keeps query-dependent KV compression for each
  # attention grid and still runs full compressed attention after merging.
  hard_route_backend: hard_c4
  hard_route_routing_backend: triton_direct_m32_n32_w1_s1_exp2_tokenmajor
