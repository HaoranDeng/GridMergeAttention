# All-layer Hard C4 with the FLOP-bounded Hellinger seed selector.
#
# Selector: 22 deterministic local/global candidate rows, 8 adaptive plus 8
# uniform key probes, two (-1,+1) probe anchors, and probes shared by four
# adjacent query columns. The merge, entropy correction, and full compressed
# second-stage attention are unchanged from Hard C4.
image_or_video_shape:
  - 1
  - 21
  - 16
  - 90
  - 160
denoising_step_list:
  - 1000
  - 750
  - 500
  - 250
warp_denoising_step: true
model_kwargs:
  model_name: Wan2.1-T2V-14B-StepDistill-CfgDistill
  load_pretrained_weights: false
  timestep_shift: 5.0
token_merging_args:
  enable: true
  f_tied: 1
  h_reduce: 1
  w_reduce: 1
  layout: hard_route
  query_outer_chunk: 1
  head_chunk: 2
  num_merge_tokens: 4
  seed_mode: hellinger_span_alpha0p3_c22_p16_a2_j4
  seed: 0
  hard_route_backend: hard_c4
