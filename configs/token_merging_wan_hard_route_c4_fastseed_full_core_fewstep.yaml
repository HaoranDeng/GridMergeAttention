image_or_video_shape:
  - 1
  - 21
  - 16
  - 60
  - 104
denoising_step_list:
  - 1000
  - 750
  - 500
  - 250
warp_denoising_step: true
model_kwargs:
  model_name: Wan2.1-T2V-1.3B
  timestep_shift: 5.0
token_merging_args:
  enable: true
  f_tied: 1
  h_reduce: 1
  w_reduce: 1
  layout: hard_route
  q_init: ith
  query_outer_chunk: 7
  num_merge_tokens: 4
  seed_mode: local_with_ith
  seed: 0
  # Non-shared hard-route keeps query-dependent KV compression for each
  # attention grid. The head-major suffix only changes K/V memory layout.
  hard_route_backend: triton_c4_direct_route_j32_w2_exp2merge_forcekeys_fp16kvbias_s1_fastdot_tokenmajor_inline_local_seed_headmajor
  hard_route_routing_backend: triton_direct_m32_n32_w1_s1_exp2_tokenmajor
