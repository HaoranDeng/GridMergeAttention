image_or_video_shape:
  - 1
  - 21
  - 16
  - 60
  - 104
denoising_step_list:
  - 1000
  - 750
  - 500
  - 250
warp_denoising_step: true
model_kwargs:
  model_name: Wan2.1-T2V-1.3B
  timestep_shift: 5.0
token_merging_args:
  enable: true
  f_tied: 1
  h_reduce: 1
  w_reduce: 1
  layout: hard_route
  q_init: ith
  query_outer_chunk: 7
  num_merge_tokens: 4
  seed_mode: random_with_ith
  seed: 0
  hard_route_backend: triton
  # Kept for backward-compatible scripts; this default now uses full
  # compressed core attention with non-shared KV compression, not an
  # R4/local-window routing backend.
  hard_route_routing_backend: triton
